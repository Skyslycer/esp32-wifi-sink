# Run with: docker compose -f compose.example.yaml up -d
services:
  radio:
    image: ghcr.io/skyslycer/esp32-wifi-sink:latest
    platform: linux/amd64
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      PUID: "10001"
      PGID: "10001"
      # Web interface port
      SINK_HTTP_PORT: "8080"
      # Audio/control port; ESP32 devices connect to this
      SINK_TCP_PORT: "8765"
      SINK_SPOTIFY_ENABLED: "true"
      SINK_AIRPLAY_ENABLED: "true"
      # Enable built-in self-signed HTTPS for browser USB flashing
      SINK_SETUP_HTTPS_ENABLED: "false"
      SINK_SETUP_HTTPS_PORT: "8443"
      # Certificate IPs/hostnames, comma-separated; empty detects automatically
      SINK_SETUP_HTTPS_HOSTS: ""
      # Server LAN IPv4 to prefill during setup; empty uses the page's IPv4
      SINK_ADVERTISED_IPV4: ""
    volumes:
      - radio-data:/data
    tmpfs:
      - /run
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  radio-data:
